[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# `vlm` (mlx, Apple Silicon) and `vlm-cuda` (torch/transformers, NVIDIA) run
# the same model on hardware that is never the same machine, and their
# transitive deps (transformers in particular) don't share one resolvable
# version range. Without this, `uv lock`'s universal resolution tries to
# satisfy both extras' constraints at once and fails even though no one ever
# installs both together.
conflicts = [[{ extra = "vlm" }, { extra = "vlm-cuda" }]]

[project]
name = "nyc-executive-orders"
version = "0.1.0"
description = "Harvester + light metadata index for NYC mayoral executive orders (Phase A: current-era live nyc.gov). OCR / full-text / historical Wayback deferred."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "BetaNYC" }]
# Tested at both ends of this range in CI (engineering-standards §1, §3).
# 3.14 is what home actually runs; 3.11 is the team's floor.
requires-python = ">=3.11,<3.15"
dependencies = [
  # HTTP client for the browser-like (non-Playwright) fetch path. Bounded below
  # the next major so a breaking release can't silently ride in.
  "requests>=2.31,<3",
  # HTML parsing to extract the dam PDF <a href> from an article page.
  "beautifulsoup4>=4.12,<5",
  # Phase B (historical Wayback backfill) engine. The archiver is BetaNYC's
  # throttled Internet-Archive harvester (EDGI `wayback` client, CDX enumeration,
  # go-slow memento fetch). We depend on it rather than reimplementing Wayback
  # logic; it is a sibling repo under ~/Code/ (see [tool.uv.sources]). Its own
  # `wayback` pin (>=0.5.1,<0.6) rides in transitively.
  "ny-gov-web-archiver",
  # PyMuPDF (imports as `fitz`) — text-layer probe (textlayer.py) + born-digital
  # extraction (extract.py). Core: needed by every parse run, incl. --no-ocr.
  # Bounded below the next major per engineering-standards §2 (no bare pins).
  "pymupdf>=1.28,<2",
  # PyYAML — emits the corpus Markdown frontmatter (build_corpus.py). Bounded.
  "pyyaml>=6,<7",
  # NumPy + Pillow — Phase E page-image measurement (vlm_ocr.py): the blank /
  # bleed-through classifier, ink-coverage reconciliation, and bbox overlays.
  # Core rather than part of the `vlm` extra on purpose: the render-only
  # calibration path (`--classify-blank-only`) must run on any machine, not just
  # Apple Silicon, since that is how a new volume's thresholds get checked
  # before a long OCR run. Both are light pure-wheel installs next to pymupdf.
  "numpy>=2,<3",
  "pillow>=10,<12",
]

[tool.uv.sources]
# The archiver is a sibling checkout, not published to PyPI. An editable path
# dependency keeps Phase B building against the live source with no git fetch
# (offline-safe). The path is relative to this repo root and holds on any machine
# that follows the workspace's flat ~/Code/ sibling-repo convention.
ny-gov-web-archiver = { path = "../ny-gov-web-archiver", editable = true }

[project.optional-dependencies]
# Playwright is ONLY needed for the WAF fallback fetch path (headless Chromium).
# It is lazily imported (see fetch.py) so the package installs and its offline
# tests run without it. The supervised live harvest installs this extra.
live = ["playwright>=1.44,<2"]
# ocrmypdf (+ Tesseract/Ghostscript binaries) is ONLY needed to OCR scanned PDFs
# (ocr.py). It is heavy (pulls pikepdf/Pillow) and lazily imported, so the
# born-digital-only path (`run_parse --no-ocr`) installs and runs without it —
# mirroring the `live`/Playwright pattern. The gated full-corpus OCR run installs
# this extra: `pip install 'nyc-executive-orders[ocr]'`.
ocr = ["ocrmypdf>=17.8,<18"]
# Phase E: the dots.ocr VLM backend (vlm_ocr.py) for the pre-1974 bound volumes.
# APPLE SILICON ONLY — mlx has no CPU/CUDA build — and lazily imported behind
# `vlm_ocr.backend()`, so the package installs and its offline tests run without
# it, exactly like the `ocr` and `live` extras. Pinned against the versions the
# proven 126-page Impellitteri-Sharkey run used (engineering-standards §0 — built
# against a real interface, not a guessed one).
#
# torch/torchvision are NOT used for compute (MLX does that). transformers'
# AutoProcessor for the Qwen2-VL family — which dots.ocr is built on —
# unconditionally loads a video sub-processor that requires both to merely be
# importable, so they ride along as import-time satisfiers.
vlm = [
  "mlx-vlm>=0.6.8,<0.7",
  "torch>=2.13,<3",
  "torchvision>=0.28,<1",
]
# Phase E, CUDA path: the same dots.ocr model run through transformers/torch on
# an NVIDIA GPU instead of MLX -- for OCR done on a Linux CUDA box rather than
# the Apple Silicon dev machine. Lazily imported behind
# `vlm_ocr.backend("cuda")`, exactly like the `vlm` extra, so installing (or
# not) this extra never affects the mlx path or the offline tests.
#
# Loads the upstream rednote-hilab/dots.ocr checkpoint (mlx-community's repos
# above are converted FROM this one) with trust_remote_code=True, which is
# required by its custom modeling code -- and runs code from that HF repo on
# load, a materially different trust boundary than the mlx path. bitsandbytes
# is what makes `--quantization 8bit/4bit` possible; accelerate is what makes
# `device_map="auto"` possible.
vlm-cuda = [
  "torch>=2.13,<3",
  "torchvision>=0.28,<1",
  "transformers>=4.46,<5",
  "accelerate>=0.34,<2",
  "bitsandbytes>=0.43,<1",
]
# `wayback` is declared here as a TEST dependency: the Phase B offline tests
# build real `wayback.CdxRecord` instances (faithful mocks, engineering-standards
# §0), mirroring the archiver's own test approach. At runtime `wayback` is pulled
# transitively by ny-gov-web-archiver and imported only inside its go-slow client.
dev = ["pytest>=8,<9", "wayback>=0.5.1,<0.6"]

[project.scripts]
nyc-executive-orders = "nyc_executive_orders.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_executive_orders"]

[tool.deptry]
# `dev` holds test-only tooling (pytest); `live` holds the optional Playwright
# fallback (lazily imported). Neither should be flagged as an unused runtime dep.
optional_dependencies_dev_groups = ["dev"]
known_first_party = ["nyc_executive_orders"]

[tool.deptry.package_module_name_map]
# beautifulsoup4 imports as `bs4`; without this, deptry reports it both unused
# (the manifest name) and undeclared (the import name).
beautifulsoup4 = ["bs4"]
# ny-gov-web-archiver (the Phase B Wayback engine) imports as `ny_gov_web_archiver`.
ny-gov-web-archiver = ["ny_gov_web_archiver"]
# PyYAML imports as `yaml`.
pyyaml = ["yaml"]
# PyMuPDF imports as `fitz` (the historical module name we use).
pymupdf = ["fitz", "pymupdf"]
# Pillow imports as `PIL`; mlx-vlm imports as `mlx_vlm` (and pulls `mlx`).
pillow = ["PIL"]
mlx-vlm = ["mlx_vlm", "mlx"]

[tool.deptry.per_rule_ignores]
# playwright (`live` extra) and ocrmypdf (`ocr` extra) are both optional and
# lazily imported (fetch.py / ocr.py); deptry sees the import but treats the
# optional-extra dep as unused/misplaced. Silence those signals for both, plus
# the `vlm` (mlx) and `vlm-cuda` (torch/transformers) backends in vlm_ocr.py,
# both lazily imported behind vlm_ocr.backend(kind).
DEP001 = ["playwright", "ocrmypdf", "mlx", "mlx_vlm", "transformers", "accelerate", "bitsandbytes"]
DEP002 = ["playwright", "ocrmypdf", "mlx-vlm", "torch", "torchvision", "transformers", "accelerate", "bitsandbytes"]
DEP004 = ["playwright", "ocrmypdf", "mlx", "mlx_vlm", "transformers", "accelerate", "bitsandbytes"]

[tool.pytest.ini_options]
# Make src/ (and the scripts/ entry points) importable in tests without an
# install step, so `uv run --with pytest python -m pytest` works offline.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
  "slow: real-OCR/subprocess-heavy test; deselect with -m 'not slow'.",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
